<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Android external keyboard remapping without root">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android external keyboard remapping without root</title>
    <link rel="stylesheet" href="./common.css">
    <style>
        form {
            width: 100%;
        }

        table {
            width: 100%;

            /* <table cellspacing="0"/> */
            border-collapse: collapse;
            border-spacing: 0;
        }

        /* <table cellpadding="0"/> */
        th, td {
            padding: 0;
        }

        th {
            text-align: left;
        }

        td select {
            width: 100%;
        }

        td:not(:last-child) {
            padding-right: 8px;
        }

        td:last-child {
            text-align: right;
        }

        #status {
            margin-top: 8px;
            color: #c00;
        }
    </style>
</head>
<body>
<div class="container">
    <a class="github-link" href="https://github.com/ris58h/exkeymo-server">
        <picture>
            <source srcset="img/github-mark-white.png" media="(prefers-color-scheme: dark)">
            <img src="img/github-mark.png" alt="GitHub">
        </picture>
    </a>

    <h1>Android external keyboard remapping without root</h1>
    <nav>
        <b>Simple</b>
        <a href="complex.html">Complex</a>
        <a href="docs.html">Docs</a>
    </nav>

    <p>
        Specify mappings below,
        download and install ExKeyMo app,
        select ExKeyMo layout in physical keyboard settings.
    </p>

    <form id="build-form">
        <table>
            <thead>
                <tr>
                    <th>From key</th>
                    <th>To key</th>
                </tr>
                </thead>
            <tbody id="tbody"></tbody>
            <tfoot>
                <tr>
                    <td>
                        <button id="add" type="button">Add key map</button>
                    </td>
                    <td></td>
                    <td>
                        <button id="removeAll" type="button">Remove all</button>
                    </td>
                </tr>
            </tfoot>
        </table>
        <p>
            <label for="layout" style="display: block;">Base layout:</label>
            <select id="layout" name="layout" style="display: block;">
                <option value="" selected>Default</option>
            </select>
            <label for="layout2" style="display: block;">Second layout:</label>
            <select id="layout2" name="layout2" style="display: block;">
                <option value="-" selected>Not needed</option>
                <option value="">Default</option>
            </select>
        </p>
        <input type="submit" value="Download">
        <div id="status" role="status" aria-live="polite"></div>
    </form>

    <script>
        let mappingId = 0

        const addButton = document.querySelector("#add")
        const removeAllButton = document.querySelector("#removeAll")
        const linuxKeyCodesTemplate = document.querySelector("#linux-keycodes")
        const androidKeysTemplate = document.querySelector("#android-keys")
        const tbody = document.querySelector("#tbody")
        const layout = document.querySelector("#layout")
        const layout2 = document.querySelector("#layout2")
        const layoutsTemplate = document.querySelector("#layouts")

        addMapping()
        addButton.addEventListener("click", addMapping)
        removeAllButton.addEventListener("click", removeAllMappings)

        layout.appendChild(layoutsTemplate.content.cloneNode(true))
        layout2.appendChild(layoutsTemplate.content.cloneNode(true))

        function addMapping() {
            mappingId++

            const from = createSelect()
            from.name = `from${mappingId}`
            from.appendChild(linuxKeyCodesTemplate.content.cloneNode(true))

            const to = createSelect()
            to.name = `to${mappingId}`
            to.appendChild(androidKeysTemplate.content.cloneNode(true))

            const removeButton = document.createElement("button")
            removeButton.type = "button"
            removeButton.textContent = "Remove"
            removeButton.addEventListener("click", e => {
                removeTableRow(e.target)
            })

            tbody.appendChild(createTableRow([
                from,
                to,
                removeButton
            ]))

            function createSelect() {
                const option = document.createElement("option")
                option.value = ""
                option.selected = true

                const select = document.createElement("select")
                select.required = true
                select.appendChild(option)

                return select
            }

            function createTableRow(elements) {
                const row = document.createElement("tr")
                for (const element of elements) {
                    const td = document.createElement("td")
                    td.appendChild(element)
                    row.appendChild(td)
                }
                return row
            }

            function removeTableRow(target) {
                target.closest("tr").remove()
            }
        }

        function removeAllMappings() {
            tbody.replaceChildren()
        }
    </script>
    <script type="module" src="js/app-simple.js"></script>
</div>
